services:
  ludock:
    image: ghcr.io/crunging/ludock:latest
    ports:
      - "${LUDOCK_PORT:-3000}:3000"
    volumes:
      # Set LUDOCK_DOCKER_SOCKET in .env for a different host socket.
      # A missing socket must fail instead of creating an empty host directory.
      - type: bind
        source: ${LUDOCK_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      # Persistent application data.
      - ludock-data:/data
      # Separate backup storage, suggested in Settings after first sign-in.
      - ludock-backups:/backups
      # To keep backups on another disk, replace the backup volume above with
      # a host-directory mount (create the directory first), for example:
      # - /srv/ludock-backups:/backups
      # Optional Compose sources: preserve identical absolute host/container
      # paths and set LUDOCK_COMPOSE_ROOTS=/srv/game-stacks in .env.
      # - /srv/game-stacks:/srv/game-stacks:ro
    env_file:
      - path: .env
        required: false
    environment:
      LUDOCK_BACKUP_ROOTS: "${LUDOCK_BACKUP_ROOTS-/backups}"
    restart: unless-stopped

volumes:
  ludock-data:
  ludock-backups:
