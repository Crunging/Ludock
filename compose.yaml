services:
  ludock:
    image: ghcr.io/crunging/ludock:latest
    ports:
      - "3000:3000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    volumes:
      # A missing socket must fail instead of creating an empty host directory.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - ludock-data:/data
      - ludock-backups:/backups
      # To keep backups on another disk, replace the backup volume above with
      # a host-directory mount (create the directory first), for example:
      # - /srv/ludock-backups:/backups
      # Optional Compose sources: preserve identical absolute host/container
      # paths and set LUDOCK_COMPOSE_ROOTS=/srv/game-stacks in .env.
      # - /srv/game-stacks:/srv/game-stacks:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  ludock-data:
  ludock-backups:
