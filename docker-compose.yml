services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - panel-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional safeguard for first-run administrator setup.
      # - PANEL_SETUP_TOKEN=change-me-to-a-strong-random-value
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  panel-data:
