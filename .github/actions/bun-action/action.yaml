name: Run GitHub integrations with Bun
description: Run pinned release and artifact bundles using Bun, or expose the job's BuildKit cache credentials.
inputs:
  integration:
    description: release-please, upload-artifact, or build-runtime
    required: true
  token:
    description: Repository token for release-please
    default: ${{ github.token }}
  name:
    description: Artifact name
    default: browser-failures
  path:
    description: Artifact paths
    default: |
      packages/frontend/test-results/
      packages/frontend/playwright-report/
  retention-days:
    description: Artifact retention
    default: '7'
  config-file:
    description: Release configuration
    default: release-please-config.json
  manifest-file:
    description: Release manifest
    default: .release-please-manifest.json
runs:
  # Container actions receive GitHub's artifact/cache runtime credentials. Shell
  # steps do not. The image contains Bun and no Node/npm/npx executable.
  using: docker
  image: Dockerfile
  args:
    - /github/workspace/scripts/ci/integration.mjs
    - ${{ inputs.integration }}
