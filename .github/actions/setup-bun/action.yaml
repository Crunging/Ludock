name: Set up Bun without Node
description: Copy the pinned Bun executable from its official image and check the repository version.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUN_IMAGE: oven/bun:1-distroless@sha256:1a0c31c7c5f9d193aedf60fe1cebdeb76ac8f6e29f24be8dd8cbd6df72df26ec
      run: |
        set -euo pipefail
        bun_directory="$RUNNER_TEMP/ludock-bun"
        mkdir -p "$bun_directory"
        container_id="$(docker create --entrypoint /usr/local/bin/bun "$BUN_IMAGE" --version)"
        trap 'docker rm "$container_id" >/dev/null' EXIT
        docker cp "$container_id:/usr/local/bin/bun" "$bun_directory/bun"
        chmod +x "$bun_directory/bun"
        test "$("$bun_directory/bun" --version)" = "$(tr -d '\r\n' < .bun-version)"
        echo "$bun_directory" >> "$GITHUB_PATH"
