name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, test, and build
        run: pnpm check

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ludock:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=min,scope=ci

      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 3000:3000 ludock:ci
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          # Without a Docker socket, "degraded" confirms the process is serving.
          for _ in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 2 \
              http://localhost:3000/api/health || true)"
            if [[ -n "$body" ]]; then
              echo "Health response: $body"
              if [[ "$body" == '{"status":"degraded"}' ]]; then
                exit 0
              fi
            fi
            sleep 2
          done

          echo "::error::The image did not serve /api/health within 60s."
          docker logs smoke
          exit 1

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ludock:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          # Block vulnerabilities only when an upstream fix is available.
          ignore-unfixed: true
          exit-code: "1"
