name: Checks
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies for vulnerabilities
        run: bun audit --audit-level=high
      - name: Type-check, lint, test, and build
        run: bun run check
      - name: Prepare Bun integration receipt
        run: |
          bun -e 'await Bun.write("test-results/ci-integration/receipt.json", JSON.stringify({ bun: Bun.version, commit: process.env.GITHUB_SHA }))'
      - name: Verify artifact upload under Bun
        uses: ./.github/actions/bun-action
        with:
          integration: upload-artifact
          name: bun-integration-receipt
          path: test-results/ci-integration/receipt.json
          retention-days: 7
        env:
          INPUT_IF-NO-FILES-FOUND: error
      - name: Verify Release Please generation under Bun
        uses: ./.github/actions/bun-action
        with:
          integration: verify-release-please
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run --filter @ludock/frontend build
      - name: Install Chromium headless shell
        working-directory: packages/frontend
        run: bun x --bun playwright install --with-deps --only-shell chromium
      - name: Check desktop and mobile browser workflows
        run: bun run --filter @ludock/frontend test:e2e
      - name: Retain browser failure details
        if: failure()
        uses: ./.github/actions/bun-action
        with:
          integration: upload-artifact
          name: browser-failures
          path: |
            packages/frontend/test-results/
            packages/frontend/playwright-report/
          retention-days: 7
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  container:
    name: Container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Expose BuildKit cache runtime
        uses: ./.github/actions/bun-action
        with:
          integration: build-runtime
      - name: Set up Docker Buildx
        run: bun scripts/ci/containers.mjs setup
      - name: Build production image
        run: bun scripts/ci/containers.mjs build check
        env:
          LUDOCK_PLATFORM: ${{ matrix.platform }}
      - name: Install test harness dependencies
        run: bun install --frozen-lockfile
      - name: Check Compose updates with disposable services
        run: bun scripts/test-compose.mjs
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
      - name: Smoke-test production startup and run Linux backend suites
        run: bun scripts/test-linux.mjs
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
      - name: Select default helper
        id: helper
        run: |
          image="$(bun -p "(await import('./packages/backend/src/runtime-images.ts')).DEFAULT_HELPER_IMAGE")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Check scoped file helpers with disposable data
        run: |
          docker pull "$(bun -p "(await import('./packages/backend/src/runtime-images.ts')).DEFAULT_HELPER_IMAGE")"
          bun scripts/test-files.mjs
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
      - name: Check backup and restore recovery with disposable data
        run: bun scripts/test-backups.mjs
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
      - name: Check packaged file transfers and backup restore
        run: bun scripts/test-packaged.mjs
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
      - name: Scan image for vulnerabilities
        run: bun scripts/ci/containers.mjs scan "$SCAN_IMAGE"
        env:
          SCAN_IMAGE: ludock:ci
      - name: Scan default helper for vulnerabilities
        if: ${{ !cancelled() && steps.helper.outcome == 'success' }}
        run: bun scripts/ci/containers.mjs scan "$SCAN_IMAGE"
        env:
          SCAN_IMAGE: ${{ steps.helper.outputs.image }}
      - name: Remove build instance
        if: always()
        run: docker buildx rm ludock
