name: Checks

# Shared verification used by CI and by both release workflows, so that nothing
# is published from a commit that has not passed `pnpm check`.
on:
  workflow_call:
    inputs:
      build_image:
        description: >-
          Build, run, and scan the production image without pushing it.
          Disabled by callers that publish the image themselves.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, test, and build
        run: pnpm check

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Set up Docker Buildx
        if: inputs.build_image
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Load the runner-native image into Docker so it can be run and scanned.
      # Release workflows perform the authoritative amd64/arm64 build before
      # publishing, so CI does not repeat that expensive cross-build.
      - name: Build production image
        if: inputs.build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docker-game-manager:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=min,scope=ci

      # Building the image proves it compiles, not that it runs. The runtime
      # stage copies pnpm's symlinked dependency tree rather than installing
      # it, so a broken layout would otherwise only surface on deploy.
      - name: Smoke-test the image
        if: inputs.build_image
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 3000:3000 docker-game-manager:ci
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            # The endpoint intentionally returns HTTP 503 when Docker is not
            # mounted, so do not use curl --fail here.
            body="$(curl --silent --show-error --max-time 2 \
              http://localhost:3000/api/health || true)"
            if [[ -n "$body" ]]; then
              echo "Health response: $body"
              # Docker is deliberately not mounted, so "degraded" is the
              # expected healthy-process answer here.
              if [[ "$body" == '{"status":"degraded"}' ]]; then
                exit 0
              fi
            fi
            sleep 2
          done

          echo "::error::The image did not serve /api/health within 60s."
          docker logs smoke
          exit 1

      - name: Scan image for vulnerabilities
        if: inputs.build_image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: docker-game-manager:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          # An unfixed base-image CVE cannot be resolved by this project and
          # should not block unrelated work.
          ignore-unfixed: true
          exit-code: "1"
