name: Dependency security
on:
  schedule:
    - cron: 23 12 * * *
  workflow_dispatch: null
permissions:
  contents: read
  packages: read
concurrency:
  group: dependency-security
  cancel-in-progress: false
jobs:
  dependencies:
    name: Package vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Audit dependencies for vulnerabilities
        run: bun audit --audit-level=high
  images:
    name: Image vulnerabilities (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Scan published release image
        shell: bash
        run: bun scripts/ci/containers.mjs scan "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
      - name: Scan fallback helper for vulnerabilities
        run: bun scripts/ci/containers.mjs scan "$(bun -p '(await import("./packages/backend/src/runtime-images.ts")).FALLBACK_HELPER_IMAGE')"
