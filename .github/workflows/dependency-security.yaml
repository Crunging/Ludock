name: Dependency security
on:
  schedule:
    - cron: 23 12 * * *
  workflow_dispatch: null
permissions:
  contents: read
  packages: read
concurrency:
  group: dependency-security
  cancel-in-progress: false
jobs:
  dependencies:
    name: Package vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Audit dependencies for vulnerabilities
        run: bun audit --audit-level=high
  images:
    name: Image vulnerabilities (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository with Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch --force --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Select published and helper images
        id: images
        shell: bash
        run: |
          set -euo pipefail

          repository="$(bun --print 'process.env.GITHUB_REPOSITORY.toLowerCase()')"
          helper_image="$(bun --print '(await import("./packages/backend/src/runtime-images.ts")).DEFAULT_HELPER_IMAGE')"
          {
            echo "release=ghcr.io/${repository}:latest"
            echo "helper=${helper_image}"
          } >> "$GITHUB_OUTPUT"
      - name: Scan published release image
        run: bun scripts/ci/containers.mjs scan "$SCAN_IMAGE"
        env:
          SCAN_IMAGE: ${{ steps.images.outputs.release }}
      - name: Scan helper image
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: bun scripts/ci/containers.mjs scan "$SCAN_IMAGE"
        env:
          SCAN_IMAGE: ${{ steps.images.outputs.helper }}
