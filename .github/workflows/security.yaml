name: Security scan

# Catch advisories published after a release. Fails the run; opens no PRs.
on:
  schedule:
    - cron: 23 12 * * 1
  workflow_dispatch: null

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Dependencies and published image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Scan the latest published image
        shell: bash
        run: bun scripts/ci/containers.mjs scan "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
      - name: Scan the fallback helper image
        run: bun scripts/ci/containers.mjs scan "$(bun -p '(await import("./packages/backend/src/runtime-images.ts")).FALLBACK_HELPER_IMAGE')"
