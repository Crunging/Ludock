name: Security scan

on:
  schedule:
    - cron: 23 12 * * 1
  workflow_dispatch: null

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Dependencies and published image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Audit journey dependencies
        working-directory: e2e
        run: npm audit --audit-level=high
      - name: Scan the latest published image
        shell: bash
        run: scripts/scan-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
