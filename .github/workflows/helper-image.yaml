name: Publish helper

on:
  push:
    branches: ["**"]
    paths:
      - helper/Dockerfile
      - .github/workflows/helper-image.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Helper (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select immutable candidate tag
        id: image
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:helper-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" >> "$GITHUB_OUTPUT"
      - name: Build patched helper
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker build --pull -t "$IMAGE" helper
      - name: Check helper runtime
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp "$IMAGE" bun -e '
            const file = "/tmp/helper-check";
            await Bun.write(file, "helper works");
            if (await Bun.file(file).text() !== "helper works") process.exit(1);
            if (!Bun.version.startsWith("1.")) process.exit(1);
            console.log(Bun.version);
          '
      - name: Scan patched helper
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned architecture
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-platform candidate
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:helper-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image" | tee -a "$GITHUB_STEP_SUMMARY"
