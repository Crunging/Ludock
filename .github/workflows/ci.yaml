name: CI

# Pull requests are the only trigger, so a branch with an open PR is not built
# twice for the same commit. Pushes to main and to release tags are covered by
# the release workflows, which run these same checks before publishing.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/checks.yaml
