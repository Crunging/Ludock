name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      ${{ !(github.base_ref == 'main' &&
      github.head_ref == 'release-please--branches--main--components--ludock' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checks.yaml
  release:
    name: Release metadata, build, and startup
    if: >-
      ${{ github.base_ref == 'main' &&
      github.head_ref == 'release-please--branches--main--components--ludock' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Validate release changes, versions, changelog, and tag
        run: bun scripts/ci/pr-checks.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          tags: ludock:ci
          cache-from: type=gha,scope=ci-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ runner.arch }}
      - name: Smoke-test production release
        run: bun scripts/test-linux.mjs --smoke-only
        env:
          LUDOCK_TEST_IMAGE: ludock:ci
