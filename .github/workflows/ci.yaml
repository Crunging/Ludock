name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  # Verify main after each merge, which can combine separately tested changes.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  # A new push supersedes an unfinished PR run. Each merge to main gets its own
  # group, since a shared group replaces a pending run when another arrives.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: Check generated templates
        run: |
          go tool templ generate -path internal/web/views
          git diff --exit-code -- internal/web/views
      - run: go vet ./...
      - run: go test -race ./...

  journeys:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci --no-audit --no-fund
      # The runner image already has Chromium's libraries. Installing them
      # with --with-deps adds an apt download that can stall for many minutes.
      - run: npx playwright install --only-shell chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-results
          path: e2e/test-results/
          retention-days: 7


  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Check action and image pins
        run: scripts/check-pins.sh

  container:
    name: Container (${{ matrix.platform }})
    # The built image against the runner's disposable Docker daemon: hardened
    # runtime, helper containers, backups, consoles, image updates, recovery.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      LUDOCK_TEST_IMAGE: ludock:ci
      LUDOCK_DOCKER_E2E: disposable-daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        # Refresh Alpine security fixes even when the pinned base is unchanged.
        run: docker build --pull --no-cache-filter runtime --tag "$LUDOCK_TEST_IMAGE" .
      - name: Install journey dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Run container journeys
        working-directory: e2e
        run: npx playwright test -c docker.config.mjs
      - name: Scan image for vulnerabilities
        if: matrix.platform == 'linux/amd64'
        run: scripts/scan-image.sh "$LUDOCK_TEST_IMAGE"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-results-${{ matrix.runner }}
          path: e2e/test-results/
          retention-days: 7
