name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  # Verify main after each merge, which can combine separately tested changes.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes an unfinished PR run; every merge to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Type-check, lint, test, and build
        run: bun run check

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ludock/frontend build
      - name: Install Chromium
        working-directory: packages/frontend
        run: bun x --bun playwright install --with-deps --only-shell chromium
      - run: bun run --filter @ludock/frontend test:e2e
      - name: Keep browser failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            packages/frontend/test-results/
            packages/frontend/playwright-report/
          retention-days: 7

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  container:
    name: Container (${{ matrix.platform }}, ${{ matrix.suite }})
    # Each job builds natively and runs one balanced group of harnesses, one at
    # a time on its own daemon. A warm layer cache saved no build time because
    # the runtime stage is always rebuilt, so none is exported.
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        suite: [runtime, compose, files]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A passing run takes about a minute; fail a hung harness sooner.
    timeout-minutes: 10
    env:
      LUDOCK_TEST_IMAGE: ludock:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build image
        # Refresh Alpine security fixes even when the pinned base is unchanged.
        run: docker build --pull --no-cache-filter runtime --tag ludock:ci .
      - run: bun install --frozen-lockfile
      - name: Smoke-test startup and run Linux backend suites
        if: matrix.suite == 'runtime'
        run: bun scripts/test-linux.mjs
      - name: Scan image for vulnerabilities
        if: matrix.suite == 'runtime'
        run: bun scripts/ci/containers.mjs scan ludock:ci
      - if: matrix.suite == 'compose'
        run: bun scripts/test-compose.mjs
      - if: matrix.suite == 'compose'
        run: bun scripts/test-backups.mjs
      - if: matrix.suite == 'files'
        run: bun scripts/test-files.mjs
      - if: matrix.suite == 'files'
        run: bun scripts/test-files.mjs --fallback-helper
      - if: matrix.suite == 'files'
        run: bun scripts/test-packaged.mjs
