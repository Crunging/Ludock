name: Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false
  # Ordinary main pushes must not replace a pending versioned release.
  queue: max

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Select release tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(bun -p "(await Bun.file('package.json').json()).version")"
          tag="v$package_version"
          previous_version="$(
            git show "${GITHUB_SHA}^:package.json" |
              bun -p "JSON.parse(await Bun.stdin.text()).version"
          )"

          if [[ "$package_version" == "$previous_version" ]]; then
            echo "::notice::Root package version unchanged; publishing nightly only."
            {
              echo "should_release=false"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases require a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$tagged_commit" != "$current_commit" ]]; then
              echo "::error::Tag $tag already exists on a different commit."
              exit 1
            fi
          fi

          {
            echo "should_release=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  check:
    uses: ./.github/workflows/checks.yaml

  release:
    name: Publish image and release
    needs:
      - validate
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        if: needs.validate.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Generate release notes
        if: needs.validate.outputs.should_release == 'true'
        run: bun scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Create release tag
        if: needs.validate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Recheck after validation while this job still owns publishing.
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Tag $RELEASE_TAG already exists on a different commit."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" --message "Ludock $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      # Prevent an older hotfix from moving latest-series tags backward.
      - name: Determine which moving tags this release owns
        if: needs.validate.outputs.should_release == 'true'
        id: rank
        shell: bash
        run: |
          set -euo pipefail

          current="$RELEASE_TAG"
          major="${current%%.*}"
          minor="${current%.*}"

          releases="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"

          newest_in() {
            local prefix="${1//./\\.}"
            printf '%s\n' "$releases" | grep -E "^${prefix}\." | sort -V | tail -n 1
          }

          highest="$(printf '%s\n' "$releases" | sort -V | tail -n 1)"
          highest_major="$(newest_in "$major")"
          highest_minor="$(newest_in "$minor")"

          {
            echo "is_latest=$([[ "$highest" == "$current" ]] && echo true || echo false)"
            echo "is_major_latest=$([[ "$highest_major" == "$current" ]] && echo true || echo false)"
            echo "is_minor_latest=$([[ "$highest_minor" == "$current" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Semver rules otherwise generate latest even for an older hotfix.
          flavor: latest=false
          tags: |
            type=raw,value=nightly
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ needs.validate.outputs.should_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ needs.validate.outputs.should_release == 'true' && steps.rank.outputs.is_minor_latest == 'true' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ needs.validate.outputs.should_release == 'true' && steps.rank.outputs.is_major_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.should_release == 'true' && steps.rank.outputs.is_latest == 'true' }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=publish
            type=gha,scope=ci-X64
            type=gha,scope=ci-ARM64
          cache-to: type=gha,mode=max,scope=publish

      - name: Create GitHub release
        if: needs.validate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_LATEST: ${{ steps.rank.outputs.is_latest }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest="$IS_LATEST"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest="$IS_LATEST"
          fi

      - name: Mark release PR as published
        if: needs.validate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # This workflow owns publication, so it also completes Release Please's
          # pending state after both the image and GitHub release are available.
          pull_number="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
              jq -r --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .[] |
                select(.merged_at != null and .merge_commit_sha == $sha) |
                select(.base.ref == "main" and .base.repo.full_name == $repo) |
                select(any(.labels[]; .name == "autorelease: pending")) |
                .number
              '
          )"

          if [[ -z "$pull_number" ]]; then
            echo "::notice::No pending release PR for this commit."
            exit 0
          fi
          if [[ ! "$pull_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected exactly one pending release PR for this commit."
            exit 1
          fi

          # Add first so an interrupted transition remains pending and retryable.
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pull_number/labels" \
            -f 'labels[]=autorelease: tagged' --silent
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$pull_number/labels/autorelease%3A%20pending" \
            --silent
